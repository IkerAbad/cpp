name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-clang,      os: ubuntu-24.04,   preset: linux-clang-debug }
          - { name: linux-gcc,        os: ubuntu-24.04,   preset: linux-gcc-debug }
          - { name: windows-msvc,     os: windows-2025,   preset: windows-msvc-debug }
          - { name: windows-clang-cl, os: windows-2025,   preset: windows-clang-cl-debug }
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Clang 18 (el de serie en 24.04) define __cpp_concepts = 201907L y libstdc++
          # solo expone std::expected con >= 202002L: hace falta Clang >= 19.
          # clang-20 y g++-14 vienen de los repositorios oficiales de Ubuntu 24.04.
          sudo apt-get install -y ninja-build clang-20 g++-14 pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev \
            xvfb mesa-vulkan-drivers

      - name: Entorno de MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: vcpkg en el commit del baseline
        # VCPKG_ROOT se fija aquí y no en env: del trabajo porque el entorno de
        # Visual Studio (paso anterior) lo redefine apuntando a su vcpkg integrado.
        run: |
          VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      # La caché se restaura antes de configurar y se guarda justo después, aunque
      # la compilación falle luego: vcpkg instala las dependencias en la
      # configuración. La clave incluye un resumen de los paquetes presentes, así
      # que solo se guarda de nuevo cuando vcpkg ha compilado algo.
      - name: Restaurar caché binaria de vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}-
          restore-keys: |
            vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ matrix.name }}-

      - name: Configurar
        id: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Clave de la caché según su contenido
        id: cache-key
        if: always() && steps.configure.outcome != 'skipped'
        run: |
          # Python y no find/sort: en Windows, System32 trae find.exe y sort.exe.
          digest=$(python -c "import hashlib, pathlib, sys; names = sorted(p.name for p in pathlib.Path(sys.argv[1]).rglob('*.zip')); print(hashlib.sha256(chr(10).join(names).encode()).hexdigest()[:16])" "$VCPKG_DEFAULT_BINARY_CACHE")
          echo "key=vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}-$digest" >> "$GITHUB_OUTPUT"

      - name: Guardar caché binaria de vcpkg
        if: >-
          always() && steps.cache-key.outputs.key != '' &&
          steps.cache-key.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.cache-key.outputs.key }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Pruebas
        run: ctest --preset ${{ matrix.preset }}

      # Render real sin GPU: Xvfb como servidor X y lavapipe (Vulkan por software de
      # Mesa). Crea el dispositivo SDL_GPU, compila el pipeline con los shaders SPIR-V,
      # sube el atlas y presenta 120 fotogramas. En Windows no hay equivalente fiable.
      - name: Humo con ventana (Vulkan por software)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          SDL_VIDEO_DRIVER: x11
        run: xvfb-run -a -s "-screen 0 1600x900x24" "build/${{ matrix.preset }}/src/rts" --frames 120

      # 2 minutos de juego: cubre todas las órdenes de data/scenarios/headless.toml
      # (la última, en el tick 1500): recogida, construcción, colas de producción y
      # los cambios de ocupación que rehacen el pathfinding.
      # Además se graba la partida: la de linux-gcc se verifica en las cuatro
      # plataformas (trabajo replay-cross).
      - name: Hash de estado (2 minutos de juego sin ventana)
        run: |
          exe="build/${{ matrix.preset }}/src/rts"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --headless --ticks 2400 --record replay-${{ matrix.name }}.rtsrep | tee headless.log
          grep -o 'state_hash=[0-9a-f]*' headless.log > hash-${{ matrix.name }}.txt
          cat hash-${{ matrix.name }}.txt
          # La repetición recién grabada se reproduce igual en la misma máquina.
          "$exe" --verify-replay replay-${{ matrix.name }}.rtsrep

      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.name }}
          path: hash-${{ matrix.name }}.txt

      - name: Subir la repetición grabada en Linux
        if: matrix.name == 'linux-gcc'
        uses: actions/upload-artifact@v4
        with:
          name: replay-linux
          path: replay-linux-gcc.rtsrep

      # Solo el ejecutable: en Linux, vcpkg enlaza estático; en Windows, el triplet es
      # x64-windows-static-md. Lo usa replay-cross sin volver a compilar.
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/src/rts
            build/${{ matrix.preset }}/src/rts.exe
          if-no-files-found: error
          retention-days: 3

  bench:
    name: Banco de rendimiento (Release, movimiento, batalla e IA contra IA)
    runs-on: ubuntu-24.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-20 g++-14 pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev

      - name: vcpkg en el commit del baseline
        run: |
          VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # Mismo triplet que el trabajo linux-clang: reutiliza su caché binaria.
      - name: Restaurar caché binaria de vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json') }}-
          restore-keys: |
            vcpkg-linux-clang-${{ hashFiles('vcpkg.json') }}-
            vcpkg-linux-clang-

      - name: Configurar y compilar (RelWithDebInfo)
        run: |
          cmake --preset linux-clang-release -DRTS_BUILD_TESTS=OFF
          cmake --build --preset linux-clang-release --target rts_bench

      # Criterio de M2: ningún tick por encima de 50 ms (el presupuesto de un tick a
      # 20 Hz). El runner es compartido: un fallo aislado se reproduce antes de culpar
      # al código, pero el umbral es el máximo, no un percentil.
      - name: 1000 unidades
        run: build/linux-clang-release/bench/rts_bench --units 1000 --ticks 1200 --max-ms 50

      - name: 2000 unidades
        run: build/linux-clang-release/bench/rts_bench --units 2000 --ticks 1200 --max-ms 50

      # Criterio de M4: batalla de dos ejércitos (500 contra 500 y 1000 contra 1000) en
      # ataque-movimiento, con el mismo umbral de 50 ms por tick.
      - name: Batalla de 1000 unidades
        run: build/linux-clang-release/bench/rts_bench --units 1000 --ticks 1200 --max-ms 50 --combat 1

      - name: Batalla de 2000 unidades
        run: build/linux-clang-release/bench/rts_bench --units 2000 --ticks 1200 --max-ms 50 --combat 1

      # 30 minutos de partida por defecto con la IA en todos los jugadores.
      - name: IA contra IA, 30 minutos
        run: build/linux-clang-release/bench/rts_bench --ticks 36000 --max-ms 50 --ai-data data

      # Criterio de M5: una partida de 30 minutos grabada se reproduce con los mismos
      # 180 hashes intermedios y el mismo hash final.
      - name: Repetición de 30 minutos
        run: |
          cmake --build --preset linux-clang-release --target rts
          exe=build/linux-clang-release/src/rts
          "$exe" --headless --ticks 36000 --record r30.rtsrep | tee record.log
          "$exe" --verify-replay r30.rtsrep | tee verify.log
          recorded=$(grep -o 'state_hash=[0-9a-f]*' record.log)
          verified=$(grep -o 'state_hash=[0-9a-f]*' verify.log)
          echo "grabada: $recorded · reproducida: $verified"
          [ "$recorded" = "$verified" ]

  determinism:
    name: Mismo hash en todas las plataformas
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          merge-multiple: true
      - name: Comparar
        run: |
          for f in hash-*.txt; do echo "$f: $(cat "$f")"; done
          distinct=$(cat hash-*.txt | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::La simulación diverge entre plataformas ($distinct hashes distintos)"
            exit 1
          fi

  # Criterio de M5: la repetición grabada en Linux (GCC) se reproduce con los mismos
  # hashes con los cuatro compiladores y en los dos sistemas.
  replay-cross:
    name: Repetición de Linux en ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-clang,      os: ubuntu-24.04 }
          - { name: linux-gcc,        os: ubuntu-24.04 }
          - { name: windows-msvc,     os: windows-2025 }
          - { name: windows-clang-cl, os: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exe-${{ matrix.name }}
          path: exe
      - uses: actions/download-artifact@v4
        with:
          name: replay-linux
      - name: Verificar
        run: |
          exe=exe/rts
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          chmod +x "$exe"
          "$exe" --verify-replay replay-linux-gcc.rtsrep
