# Sonido propio (F2): todo se sintetiza por código al arrancar; no se carga ninguna
# grabación. Cada sonido es una suma de capas; cada capa, un oscilador con envolvente
# (subida lineal de attack_ms y caída hasta el silencio en decay_ms) y filtros.
#
# wave: seno, triangulo, cuadrada, sierra, ruido. El tono va de freq_start_hz a
# freq_end_hz. repeats/repeat_ms: golpes repetidos (crepitar). variants: versiones con
# el tono separado variant_cents (100 = un semitono), para que no suene clonado.
# cooldown_ms: el mismo sonido no se repite antes (cien espadas no suenan cien veces).

[audio]
sample_rate = 48000
# Mezcla adelantada a la tarjeta: 60 ms (lo justo para no cortarse).
latency_ms = 60
max_voices = 24
master_percent = 80
effects_percent = 80
music_percent = 40
# Cambio de pieza en 3 s; tras 15 s sin combate a la vista, vuelve la música de paz.
fade_ms = 3000
battle_hold_ms = 15000
# Lo que pasa hasta 200 px fuera de la pantalla aún se oye, cada vez más bajo.
hearing_margin_px = 200
pan_percent = 80
# Un edificio en llamas a la vista crepita cada 0,9 s.
fire_interval_ms = 900

[events]
melee_hit = "espada"
blunt_hit = "golpe"
shot = "flecha_suelta"
ranged_hit = "flecha_impacto"
siege_hit = "ariete"
death = "caida"
collapse = "derrumbe"
fire = "fuego"
chop = "hacha"
mine = "pico"
build = "martillo"
alarm = "cuerno"
ready = "listo"
built = "obra_terminada"
order = "clic"

[music]
peace = "paz"
battle = "batalla"

