# Arte propio (F1): cómo se pinta cada cosa. Todo se dibuja por código al arrancar con
# formas simples; no se carga ninguna imagen. Ningún recurso de otro juego.
#
# Colores [r, g, b], 0-255. La tela de las figuras, las gualdrapas, las lonas y los
# estandartes se tiñen con el color del jugador; cloth es el color si no tienen dueño.
# Medidas en píxeles de pantalla (una casilla mide 64x32).

[style]
# La luz viene de arriba a la izquierda: las caras que miran a la izquierda al 88 %,
# las de la derecha al 66 %.
light_left_percent = 88
light_right_percent = 66
# Contorno oscuro de un píxel alrededor de figuras y edificios, y sombra en el suelo.
outline = [24, 20, 18]
outline_alpha_percent = 70
shadow_alpha_percent = 32
# Grano de los materiales (piedra, madera, paja): ±12 % de brillo.
grain_percent = 12
# Variantes de cada textura de terreno (se elige por casilla).
terrain_variants = 4

[effects]
flame_outer = [232, 92, 24]
flame_inner = [255, 214, 92]
smoke = [150, 146, 140]
flame_px = 18
smoke_px = 26
flame_frames = 6

