# Mejoras de la herrería (C1). Se investigan de una en una en la herrería (at), pagando
# cost al empezar, en research_ticks; requires: la mejora anterior de su línea ("" =
# ninguna). Suman a todas las unidades del jugador de las clases (classes), las que ya
# tiene y las nuevas; el ataque, solo al que ya lo tenía.
# La armadura fue a más a lo largo de la Edad Media: «Single plates of metal armour
# were again used from the late 13th century on, to protect joints and shins, and these
# were worn over a mail hauberk», y «By about 1420, complete suits of plate armour had
# been developed in Europe»; pero «The cost of a full suit of high quality fitted
# armour ... was enormous, and inevitably restricted to the wealthy» (Wikipedia,
# «Plate armour»): por eso el arnés de placas es caro y solo para la caballería.
[[upgrade]]
name = "armas_templadas"
label = "Armas templadas"
at = "herreria"
cost = { hierro = 60, madera = 40 }
research_ticks = 600
requires = ""
classes = ["infanteria", "caballeria"]
attack_melee = 1
attack_pierce = 0
armor_melee = 0
armor_pierce = 0

