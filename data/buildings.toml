# Tipos de edificio. El identificador de cada tipo es su posición en la lista.
# size_tiles: lado de la huella (bloquea esas casillas desde que se colocan los cimientos).
# cost: se cobra al colocar. build_ticks: ticks de trabajo de un aldeano; n aldeanos
#   construyen n veces más rápido.
# accepts: recursos que se pueden descargar aquí (almacén).
# population: plazas de población que aporta cuando está terminado.
# trains: unidades que produce (nombres de units.toml).
# farm_food: si es mayor que 0, es una granja: al terminarse la cultiva su dueño y da
#   esa comida; al agotarse desaparece (hay que construir otra).
# material: "madera" o "piedra". Sin armas de asedio no se daña un edificio: se le
#   prende fuego. La madera arde hasta caer; en la piedra el fuego consume tejado e
#   interior y el edificio queda quemado (inutilizado) hasta repararlo; solo el
#   asedio la derriba.
# requires: edificios (terminados) que hay que tener para poder colocarlo.
# supplies: abastece; las tropas propias a su alrededor reponen víveres y munición
#   (engine.toml, [supply]): el centro urbano, el molino (grano) y el cuartel.
# store_capacity: campamento de campaña: abastece desde su propio almacén (esta
#   capacidad), que llenan los convoyes, no desde el del jugador (0 = no lo es). Lo
#   que entrena también lo paga ese almacén. store_target: lo que los convoyes
#   procuran tener en él (cada viaje lleva lo que falta).
# beds: puesto médico (0 = no lo es): camas; nurses: enfermeros (aldeanos) que admite;
#   care_percent: calidad de los cuidados (% del ritmo base de engine.toml [medicine]);
#   heal_to_percent: hasta qué % de la vida cura (lo que queda, si es leve, sana solo).
# sight_tiles: vista del edificio (niebla de guerra): el centro urbano y el
#   campamento vigilan lejos; una casa, poco.
# gate: puerta (B4): sus casillas dejan pasar a las unidades del dueño y a nadie más;
#   el enemigo que llega a ella se queda ante ella y acaba atacándola (la de madera
#   se quema; la de piedra solo cae por asedio).
# garrison: torre (B4): plazas de guarnición (0 = no admite). Dentro no se puede atacar
#   a nadie; los tiradores disparan con garrison_levels niveles de altura a favor (se
#   suman a los del terreno: más alcance y más daño).
# climbable: tramo de muro que el enemigo puede tomar con escalas (B4).
# market: mercado (C3): se compra y vende por oro y es destino de caravanas.
# vital: quien tuvo alguno terminado pierde la partida cuando ya no le queda ninguno
#   terminado (los que estén en obra no cuentan).
# armor: armadura { cuerpo, proyectil }; class: clase de armadura (de units.toml).
# color: RGB provisional; el dueño se indica con el color del jugador.
#
# Valores de diseño propios, a ajustar jugando.

