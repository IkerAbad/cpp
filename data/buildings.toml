# Tipos de edificio. El identificador de cada tipo es su posición en la lista.
# size_tiles: lado de la huella (bloquea esas casillas desde que se colocan los cimientos).
# cost: se cobra al colocar. build_ticks: ticks de trabajo de un aldeano; n aldeanos
#   construyen n veces más rápido.
# accepts: recursos que se pueden descargar aquí (almacén).
# population: plazas de población que aporta cuando está terminado.
# trains: unidades que produce (nombres de units.toml).
# farm_food: si es mayor que 0, es una granja: al terminarse la cultiva su dueño y da
#   esa comida; al agotarse desaparece (hay que construir otra).
# vital: quien tuvo alguno terminado pierde la partida cuando ya no le queda ninguno
#   terminado (los que estén en obra no cuentan).
# armor: armadura { cuerpo, proyectil }; class: clase de armadura (de units.toml).
# color: RGB provisional; el dueño se indica con el color del jugador.
#
# Valores de diseño propios, a ajustar jugando.

[[building]]
name = "centro_urbano"
size_tiles = 3
cost = { madera = 275, piedra = 100 }
build_ticks = 3000
hp = 2400
accepts = ["comida", "madera", "piedra", "oro"]
population = 5
armor = { cuerpo = 3, proyectil = 8 }
class = "edificio"
trains = ["aldeano"]
farm_food = 0
vital = true
color = [196, 176, 140]

