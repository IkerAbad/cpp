# Campaña de Las Navas de Tolosa, capítulo 3 (F4). Sierra Morena de este a oeste; el
# puerto del centro lo guardan los almohades; al oeste, una senda estrecha y revuelta
# (el Puerto del Rey) que nadie vigila. Al sur, el llano y el campamento del califa con
# su palenque (cerco de empalizada, lista de [[building]] al final). Con niebla: la senda
# hay que encontrarla.
name = "Las Navas de Tolosa, 16 de julio de 1212"
players = 2
width = 128
height = 112
base = "pradera"
base_level = 2
briefing = """
Julio de 1212. La hueste de Castilla, Aragón y Navarra ha llegado a Sierra Morena, pero el califa an-Nasir ha cerrado el puerto con sus hombres y espera en el llano, al otro lado. Forzar el paso es una matanza.

Un pastor dice conocer una senda por el oeste. Objetivos: cruza la sierra con 25 tropas y destruye la tienda del califa, dentro de su palenque, antes de que acabe el plazo.
"""

