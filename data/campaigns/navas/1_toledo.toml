# Campaña de Las Navas de Tolosa, capítulo 1 (F4). Mapa escrito a mano con pinceladas
# (formato en src/game/scenario.hpp). Toledo, en un cerro dentro del meandro del Tajo,
# abierto solo por el norte; dos puentes cruzan el río (el terreno vado hace de puente).
name.es = "Toledo, 1212: la reunión de la hueste"
name.en = "Toledo, 1212: gathering the host"
players = 2
width = 128
height = 96
base = "pradera"
base_level = 2
briefing.es = """
Toledo, primavera de 1212. Alfonso VIII de Castilla ha llamado a la guerra contra el califa almohade, y a la ciudad llegan caballeros de toda la cristiandad. Una hueste no vive del aire: hay que juntar víveres para la marcha y reunir a la tropa al otro lado del Tajo, camino del sur.

Objetivos: junta 1500 de comida en el almacén y lleva 30 tropas al campo de la reunión, al sur del río, antes de que acabe el plazo. Toledo no puede caer.
"""
briefing.en = """
Toledo, spring of 1212. Alfonso VIII of Castile has called for war against the Almohad caliph, and knights from all over Christendom are arriving in the city. An army does not live on air: food must be gathered for the march and the troops assembled across the Tagus, on the road south.

Objectives: gather 1500 food in your store and bring 30 troops to the gathering field, south of the river, before time runs out. Toledo must not fall.
"""

