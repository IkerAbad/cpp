# Campaña de Las Navas de Tolosa, capítulo 2 (F4). Calatrava la Vieja: cerro amesetado
# en la margen izquierda (sur) del Guadiana, con foso de agua del río. La puerta mira al
# oeste; delante del foso, una calzada. El recinto de muralla y torres se genera aparte
# (lista de [[building]] al final).
name.es = "Calatrava la Vieja, 1212: el asedio"
name.en = "Calatrava la Vieja, 1212: the siege"
players = 2
width = 128
height = 96
base = "pradera"
base_level = 2
briefing.es = """
Junio de 1212. La hueste ha bajado de Toledo y ha tomado Malagón. Delante está Calatrava, que los almohades ganaron tras Alarcos y guardan desde entonces: una ciudad amurallada sobre un cerro, con el Guadiana al norte y un foso alrededor.

Objetivos: toma el alcázar de Calatrava (su centro) antes de que acabe el plazo y conserva tu campamento, que da de comer al ejército. Su almacén no dura mucho: las carretas tienen que traer víveres desde Malagón, al oeste. Los arietes abren la puerta; los zapadores, las murallas; la tropa a pie puede escalar con escalas.
"""
briefing.en = """
June 1212. The host has come down from Toledo and taken Malagón. Ahead lies Calatrava, which the Almohads won after Alarcos and have held ever since: a walled town on a hill, with the Guadiana to the north and a moat all around.

Objectives: take the citadel of Calatrava (its centre) before time runs out and keep your camp, which feeds the army. Its store does not last long: the carts must bring food from Malagón, to the west. Battering rams break the gate; sappers, the walls; foot troops can climb with ladders.
"""

