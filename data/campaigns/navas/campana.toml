# Campaña de Las Navas de Tolosa (F4). Textos propios; las fuentes son citas literales,
# comprobadas sobre el texto de cada artículo (tests/test_campaign.cpp comprueba que cada
# capítulo tiene alguna y que su escenario se carga). Los textos propios van en español
# y en inglés (clave.es, clave.en); las citas, en su idioma original.
name.es = "Las Navas de Tolosa, 1212"
name.en = "Las Navas de Tolosa, 1212"
intro.es = """
En 1195 el califa almohade derrotó a Alfonso VIII de Castilla en Alarcos. Diecisiete años después, Castilla, Aragón y Navarra, con voluntarios de otros reinos y cruzados de más allá de los Pirineos, salen de Toledo hacia el sur. Tres capítulos: la reunión, el asedio y la batalla.
"""
intro.en = """
In 1195 the Almohad caliph defeated Alfonso VIII of Castile at Alarcos. Seventeen years later, Castile, Aragon and Navarre, with volunteers from other kingdoms and crusaders from beyond the Pyrenees, march south from Toledo. Three chapters: the gathering, the siege and the battle.
"""

[[chapter]]
id = "toledo"
title.es = "La reunión de Toledo"
title.en = "The gathering at Toledo"
date.es = "mayo y junio de 1212"
date.en = "May and June 1212"
scenario = "1_toledo.toml"
rival = "normal"
fog = false
history.es = """
Toledo fue el punto de reunión de la campaña. La ciudad se alza en un cerro que el Tajo ciñe con un meandro; el lado que el río no cierra es su única entrada natural. En el juego, el reto es la logística: juntar víveres y tropa antes de partir. Los detalles del mapa (sotos, minas, el sitio exacto del campo de la reunión) son inventados.
"""
history.en = """
Toledo was the gathering point of the campaign. The city stands on a hill wrapped by a meander of the Tagus; the side the river leaves open is its only natural entrance. In the game, the challenge is logistics: gathering food and troops before setting out. The map details (groves, mines, the exact site of the gathering field) are invented.
"""

[[chapter.source]]
quote = "Comenzó los preparativos en 1211, año en que empezó a movilizar tropas y congregarlas en Toledo, que era el punto de reunión de todo el contingente."
work.es = "Wikipedia en español, «Batalla de las Navas de Tolosa»"
work.en = "Spanish Wikipedia, \"Batalla de las Navas de Tolosa\""
url = "https://es.wikipedia.org/wiki/Batalla_de_las_Navas_de_Tolosa"

[[chapter.source]]
quote = "The final gathering took place in Toledo in May 1212."
work.es = "Wikipedia en inglés, «Battle of Las Navas de Tolosa»"
work.en = "English Wikipedia, \"Battle of Las Navas de Tolosa\""
url = "https://en.wikipedia.org/wiki/Battle_of_Las_Navas_de_Tolosa"

[[chapter.source]]
quote = "El casco urbano antiguo está recostado en la margen derecha del río Tajo, en una colina de cien metros de altura sobre el mismo, el cual la ciñe por su base, formando un pronunciado meandro conocido como torno del Tajo."
work.es = "Wikipedia en español, «Toledo»"
work.en = "Spanish Wikipedia, \"Toledo\""
url = "https://es.wikipedia.org/wiki/Toledo"

[[chapter]]
id = "calatrava"
title.es = "El asedio de Calatrava"
title.en = "The siege of Calatrava"
date.es = "finales de junio de 1212"
date.en = "late June 1212"
scenario = "2_calatrava.toml"
rival = "normal"
fog = false
history.es = """
Camino del sur, la hueste tomó Malagón y después Calatrava la Vieja, en manos almohades desde Alarcos. Alfonso VIII pactó con la guarnición que no la matarían; tras estas tomas, casi todos los cruzados de más allá de los Pirineos se volvieron a casa. En el juego, el recinto (muralla, torres, foso) está simplificado; el plazo es una regla del juego, no un dato histórico.
"""
history.en = """
On the way south, the host took Malagón and then Calatrava la Vieja, held by the Almohads since Alarcos. Alfonso VIII agreed with the garrison that its men would be spared; after these captures, almost all the crusaders from beyond the Pyrenees went home. In the game, the enclosure (wall, towers, moat) is simplified; the time limit is a game rule, not a historical fact.
"""

[[chapter.source]]
quote = "Calatrava ocupa un cerro amesetado de planta ovoide, con 5 ha de extensión, en la margen izquierda del río Guadiana."
work.es = "Wikipedia en español, «Calatrava la Vieja»"
work.en = "Spanish Wikipedia, \"Calatrava la Vieja\""
url = "https://es.wikipedia.org/wiki/Calatrava_la_Vieja"

[[chapter.source]]
quote = "El recinto comprende un total de 44 torres con un foso que lo rodea, de época árabe, alimentado por las aguas del río Guadiana."
work.es = "Wikipedia en español, «Calatrava la Vieja»"
work.en = "Spanish Wikipedia, \"Calatrava la Vieja\""
url = "https://es.wikipedia.org/wiki/Calatrava_la_Vieja"

[[chapter.source]]
quote = "La ciudad fue recuperada por los almohades en 1195, tras su victoria sobre Alfonso VIII en la batalla de Alarcos."
work.es = "Wikipedia en español, «Calatrava la Vieja»"
work.en = "Spanish Wikipedia, \"Calatrava la Vieja\""
url = "https://es.wikipedia.org/wiki/Calatrava_la_Vieja"

[[chapter.source]]
quote = "Durante la marcha inicial, tras las tomas del castillo de Malagón y el de Calatrava, se produjo la deserción de casi todos los ultramontanos, y las causas aún están por esclarecerse."
work.es = "Wikipedia en español, «Batalla de las Navas de Tolosa»"
work.en = "Spanish Wikipedia, \"Batalla de las Navas de Tolosa\""
url = "https://es.wikipedia.org/wiki/Batalla_de_las_Navas_de_Tolosa"

[[chapter]]
id = "navas"
title.es = "La batalla de Las Navas"
title.en = "The battle of Las Navas"
date.es = "16 de julio de 1212"
date.en = "16 July 1212"
scenario = "3_navas.toml"
rival = "normal"
fog = true
history.es = """
El califa an-Nasir cerró los pasos de Sierra Morena. Las crónicas castellanas cuentan que un pastor (algunos autores lo llaman Martín Alhaja; otros relatos hablan de san Isidro) enseñó a la hueste una senda por el oeste. Ya en el llano, el lunes 16 de julio los cristianos atacaron el campamento almohade, cuyo último reducto era el palenque del califa. El mapa simplifica el terreno; la senda está, como en el relato, al oeste.
"""
history.en = """
Caliph an-Nasir closed the passes of Sierra Morena. The Castilian chronicles tell that a shepherd (some authors call him Martín Alhaja; other accounts speak of Saint Isidore) showed the host a path to the west. Once on the plain, on Monday 16 July, the Christians attacked the Almohad camp, whose last stronghold was the caliph's palisade. The map simplifies the terrain; the path lies, as in the account, to the west.
"""

[[chapter.source]]
quote = "Sin embargo, An-Nasir decidió cortar el acceso del enemigo al valle, y para ello situó hombres en puntos clave, de forma tal que los cristianos quedaron rodeados por montañas y, por tanto, con una muy limitada capacidad de maniobra."
work.es = "Wikipedia en español, «Batalla de las Navas de Tolosa»"
work.en = "Spanish Wikipedia, \"Batalla de las Navas de Tolosa\""
url = "https://es.wikipedia.org/wiki/Batalla_de_las_Navas_de_Tolosa"

[[chapter.source]]
quote = "A pesar de todo, los cristianos consiguieron superar la adversidad: harían el movimiento de aproximación al enemigo por el oeste, a través de un paso llamado Puerto del Rey, que les permitió cruzar la sierra para luego, ya en terreno llano, marchar contra el rival."
work.es = "Wikipedia en español, «Batalla de las Navas de Tolosa»"
work.en = "Spanish Wikipedia, \"Batalla de las Navas de Tolosa\""
url = "https://es.wikipedia.org/wiki/Batalla_de_las_Navas_de_Tolosa"

[[chapter.source]]
quote = "El lunes, 16 de julio, atacan a las huestes almohades."
work.es = "Wikipedia en español, «Batalla de las Navas de Tolosa»"
work.en = "Spanish Wikipedia, \"Batalla de las Navas de Tolosa\""
url = "https://es.wikipedia.org/wiki/Batalla_de_las_Navas_de_Tolosa"

[[chapter.source]]
quote = "Finalmente, los cuerpos de élite en la retaguardia, y por último, el palenque de An-Nasir, una estructura fortificada con cestos de flechas e incluso animales (camellos, bestias de carga) y otros elementos defensivos; todo el recinto estaba protegido por filas de arqueros, lanceros y ballesteros."
work.es = "Wikipedia en español, «Batalla de las Navas de Tolosa»"
work.en = "Spanish Wikipedia, \"Batalla de las Navas de Tolosa\""
url = "https://es.wikipedia.org/wiki/Batalla_de_las_Navas_de_Tolosa"
