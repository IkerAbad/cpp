# Aprendizaje, capítulo 1 (H1): el tutorial. Mapa pequeño escrito a mano (formato en
# src/game/scenario.hpp). La puebla al oeste, con bosque y bayas a mano; al este, el
# real de una algara enemiga: su cuartel (que la abastece de su propio almacén) y una
# torre de madera. El rival usa el perfil «guarnicion»: solo se defiende.
name.es = "Una puebla en la frontera"
name.en = "A settlement on the frontier"
players = 2
width = 64
height = 48
base = "pradera"
base_level = 2
objectives_in_order = true
briefing.es = """
El señor de estas tierras os ha dado carta puebla: tierra y fueros a cambio de poblarla y defenderla. Llegáis cuatro aldeanos con lo puesto. Al este ha acampado una algara enemiga.

Cómo se juega:
- Elegir: clic sobre una unidad o arrastrar un recuadro con el botón izquierdo. Mayús añade a la selección; Esc la vacía.
- Ordenar: clic derecho. Sobre un árbol o unas bayas, recoger; sobre el suelo, ir; sobre un enemigo, atacar; sobre una obra propia, construir.
- Construir: con aldeanos elegidos, botón del edificio en el panel «Selección» y clic en el suelo.
- Adiestrar: clic sobre un edificio propio y los botones de su panel.
- Cámara: flechas o WASD, o el ratón en el borde de la ventana. F2 abre la ayuda.

Los objetivos aparecen de uno en uno, arriba a la derecha.
"""
briefing.en = """
The lord of these lands has granted you a "carta puebla": land and rights in exchange for settling and defending it. You arrive as four villagers with nothing but what you carry. To the east, an enemy raiding party has made camp.

How to play:
- Select: click a unit or drag a box with the left button. Shift adds to the selection; Esc clears it.
- Give orders: right-click. On a tree or berries, gather; on the ground, move; on an enemy, attack; on a building of yours under construction, build.
- Build: with villagers selected, the building's button in the "Selection" panel, then click on the ground.
- Train: click a building of yours and the buttons in its panel.
- Camera: arrows or WASD, or the mouse at the edge of the window. F2 opens the help.

The objectives appear one at a time, at the top right.
"""

