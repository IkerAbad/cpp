# Los pasos, en orden. Cada uno cuenta en cuanto se cumple; la interfaz enseña el primero
# que falta. «recoger» cuenta lo recogido desde el principio, aunque se gaste: quien
# aprende no tiene que ahorrar para cumplir el paso.
[[objective]]
player = 0
kind = "recoger"
text.es = "Tala: elige a los aldeanos y haz clic derecho en un árbol. Recoge 60 de madera"
text.en = "Chop wood: select the villagers and right-click a tree. Gather 60 wood"
resource = "madera"
count = 60

[[objective]]
player = 0
kind = "tener"
text.es = "Construye una casa (30 de madera): da 5 plazas de población"
text.en = "Build a house (30 wood): it gives 5 population places"
building = "casa"

[[objective]]
player = 0
kind = "recoger"
text.es = "Recoge bayas: clic derecho en un arbusto de bayas. Recoge 100 de comida"
text.en = "Gather berries: right-click a berry bush. Gather 100 food"
resource = "comida"
count = 100

[[objective]]
