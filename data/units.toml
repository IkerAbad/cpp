# Tipos de unidad. El identificador de cada tipo es su posición en esta lista.
# Magnitudes en enteros con la unidad en el nombre de la clave (_milli = milésimas):
#   radius_milli_tiles = 300           -> radio de 0,3 casillas
#   speed_milli_tiles_per_tick = 60    -> 0,06 casillas/tick = 1,2 casillas/s a 20 Hz
# cost: recursos que cuesta entrenarla (claves: comida, madera, piedra, oro, hierro;
#   las ausentes valen 0). El coste refleja el equipo (hierro: armas y armaduras;
#   oro: la paga de profesionales; comida: sustento y forraje) y train_ticks, la
#   instrucción que necesita. train_ticks: tiempo de entrenamiento (20 ticks = 1 s).
# population: plazas de población que ocupa.
# worker: recoge recursos y construye; carry_capacity = unidades que lleva encima.
# color: RGB provisional (0-255) hasta que haya arte.
#
# Combate. Daño por golpe:
#   max(1, max(0, ataque.cuerpo - armadura.cuerpo)
#          + max(0, ataque.proyectil - armadura.proyectil) + bonus[clase del blanco])
# hp: vida. class: clase de armadura (de "classes"). bonus: daño extra contra clases.
# range_milli_tiles: alcance entre los bordes del atacante y el blanco.
# reload_ticks: ticks entre golpes. sight_tiles: radio en el que busca blancos solo.
# projectile_speed_milli_tiles_per_tick: 0 = cuerpo a cuerpo; si no, dispara un
#   proyectil hacia donde está el blanco al disparar (se puede esquivar moviéndose).
# auto_attack: si busca blancos solo (los aldeanos no).
# Edificios: sin asedio no se les hace daño. ignite: fuego que aviva cada golpe contra
#   un edificio (antorchas; en los tiradores, flechas incendiarias); extinguish: fuego
#   que quita por tick apagando (los aldeanos, con cubos y mantas, son los mejores).
#   siege: su golpe daña edificios; buildings_only: solo ataca edificios.
#
# Papeles con criterio histórico (valores de diseño propios, a ajustar jugando):
# - leva: lanza y escudo, la base de cualquier ejército; barata, se instruye en
#   días; en formación frena a la caballería (bonus contra caballería).
# - hombre de armas: profesional con armadura de hierro; caro y lento de formar.
# - arquero: arco; barato en material pero exige años de práctica (instrucción muy
#   larga); flojo contra armadura.
# - ballestero: ballesta (madera y hierro); se aprende rápido; recarga lenta pero
#   perfora armadura (mucho ataque por disparo).
# - jinete: caballería ligera; exploración e incursiones.
# - caballero: caballería pesada con armadura; carísimo; carga.

classes = ["aldeano", "infanteria", "tirador", "caballeria", "edificio"]

