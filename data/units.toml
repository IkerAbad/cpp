# Tipos de unidad. El identificador de cada tipo es su posición en esta lista.
# Magnitudes en enteros con la unidad en el nombre de la clave (_milli = milésimas):
#   radius_milli_tiles = 300           -> radio de 0,3 casillas
#   speed_milli_tiles_per_tick = 60    -> 0,06 casillas/tick = 1,2 casillas/s a 20 Hz
# cost: recursos que cuesta entrenarla (claves: comida, madera, piedra, oro, hierro;
#   las ausentes valen 0). El coste refleja el equipo (hierro: armas y armaduras;
#   oro: la paga de profesionales; comida: sustento y forraje) y train_ticks, la
#   instrucción que necesita. train_ticks: tiempo de entrenamiento (20 ticks = 1 s).
# population: plazas de población que ocupa.
# worker: recoge recursos y construye; carry_capacity = unidades que lleva encima.
# color: RGB provisional (0-255) hasta que haya arte.
#
# Combate. Daño por golpe:
#   max(1, max(0, ataque.cuerpo - armadura.cuerpo)
#          + max(0, ataque.proyectil - armadura.proyectil) + bonus[clase del blanco])
# hp: vida. class: clase de armadura (de "classes"). bonus: daño extra contra clases.
# range_milli_tiles: alcance entre los bordes del atacante y el blanco.
# reload_ticks: ticks entre golpes. sight_tiles: radio en el que busca blancos solo.
# projectile_speed_milli_tiles_per_tick: 0 = cuerpo a cuerpo; si no, dispara un
#   proyectil hacia donde está el blanco al disparar (se puede esquivar moviéndose).
# auto_attack: si busca blancos solo (los aldeanos no).
# Edificios: sin asedio no se les hace daño. ignite: fuego que aviva cada golpe contra
#   un edificio (antorchas; en los tiradores, flechas incendiarias); extinguish: fuego
#   que quita por tick apagando (los aldeanos, con cubos y mantas, son los mejores).
#   siege: su golpe daña edificios; buildings_only: solo ataca edificios;
#   undermine: contra la piedra mina bajo los cimientos (su ataque ignora la
#   armadura); contra la madera, prende fuego como cualquiera.
#
# Papeles con criterio histórico (valores de diseño propios, a ajustar jugando):
# - leva: lanza y escudo, la base de cualquier ejército; barata, se instruye en
#   días; en formación frena a la caballería (bonus contra caballería).
# - hombre de armas: profesional con armadura de hierro; caro y lento de formar.
# - arquero: arco; barato en material pero exige años de práctica (instrucción muy
#   larga); flojo contra armadura.
# - ballestero: ballesta (madera y hierro); se aprende rápido; recarga lenta pero
#   perfora armadura (mucho ataque por disparo).
# - jinete: caballería ligera; exploración e incursiones.
# - caballero: caballería pesada con armadura; carísimo; carga.
# - ariete: tronco con cabeza de hierro bajo un cobertizo cubierto de pieles húmedas:
#   inmune al fuego y casi a las flechas, pero sin defensa cuerpo a cuerpo; lento.
#   Derriba la piedra a golpes.
# - zapador: cava bajo los cimientos apuntalando con madera y luego quema los
#   puntales para que el muro se hunda. Más lento que el ariete, pero ignora la
#   armadura de los muros y, bajo tierra, las flechas apenas le alcanzan.
#
# Logística (engine.toml, [supply]):
# rations: raciones que lleva encima; ration_ticks: lo que dura cada una. Un soldado
#   come 1 ración por minuto y lleva para 6 min. La caballería gasta el triple (el
#   forraje del caballo pesa más que la comida del jinete): lleva el doble y le dura
#   4 min. Los aldeanos comen en casa: 1 ración cada 2 min, la reponen al descargar;
#   con hambre trabajan más despacio. El bagaje come de su propia carga.
# starves: sin raciones acaba perdiendo vida (los aldeanos, no).
# ammo: disparos que lleva (0 = cuerpo a cuerpo). Las flechas se servían en haces de
#   24; aquí se reponen de 6 en 6 (ammo_bundle) pagando ammo_cost cada vez: astiles de
#   madera; los virotes de ballesta, además, punta de hierro.
# - trabuquete (de contrapeso): se transportaba desmontado en carros y lo volvía a
#   montar en el sitio un maestro de ingenios. Aquí se monta en un campamento de
#   campaña, pagado con lo que han traído los convoyes; montado no se mueve
#   (velocidad 0). Más lento que el ariete, pero derriba desde lejos y no hay que
#   arrimarlo al muro.
# treatable: persona a la que se cura en un puesto médico y cuyas heridas leves sanan
#   solas (no los animales del bagaje ni los ingenios, que se reparan o se pierden).
# care_skill: pericia atendiendo heridos en un puesto médico (% del cuidado de un
#   enfermero; 0 = no sabe). El aldeano hace de enfermero (100); el barbero cirujano,
#   oficio de pago, cura mucho mejor.
# morale_resolve: firmeza (% que resiste la moral; las pérdidas se escalan por
#   100 / firmeza; 0 = sin moral: aldeanos, bagaje e ingenios no se desbandan). La leva,
#   campesinos con poca instrucción, cede antes (70); el caballero, profesional y bien
#   protegido, es el más firme (150). Ardant du Picq («Battle Studies») explica la
#   firmeza por la confianza en los compañeros: la de grupos que se conocen y se vigilan
#   entre sí («the mutual supervision of groups of men who know each other well»).
# rough_speed_percent: % de su velocidad fuera de llano, sobre lo que ya resta el
#   terreno (B2). La carreta de bueyes se atasca en el bosque y en las cuestas (50); el
#   ariete, con su cobertizo, también (60); la acémila va por donde va un hombre (100).
# charge_percent: ataque del primer golpe tras una carrera de 1 s, solo sobre llano
#   firme (100 = no carga). El caballero, con lanza y caballo de guerra, dobla (200); el
#   jinete ligero, la mitad más (150).
# convoy_capacity: bagaje que lleva suministros (0 = no es bagaje). La acémila carga
#   como un hombre y medio y va a su paso; la carreta de bueyes carga cinco veces más
#   pero va a la mitad de velocidad. Sus animales comen de la carga.

classes = ["aldeano", "infanteria", "tirador", "caballeria", "edificio", "asedio", "bagaje"]

