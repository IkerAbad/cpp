# Guion de órdenes para el modo --headless. La CI lo ejecuta con los cuatro
# compiladores y exige el mismo hash de estado: cubre el ciclo de los aldeanos, la
# construcción, las colas de producción, la actualización incremental del
# pathfinding al talar y construir, y el movimiento.
#
# action:
#   mover     -> las unidades [first, first + count) del jugador (orden de creación) a target
#   recoger   -> esas unidades al nodo del recurso más cercano a ellas
#   construir -> colocar building cerca del primer edificio del jugador; lo construyen ellas
#   entrenar  -> encolar count unidades de tipo unit en el primer edificio building del jugador

# construir: el sitio se busca en anillos alrededor del primer edificio del jugador,
# dejando gap_tiles casillas libres entre ambos, hasta search_radius_tiles.
[build_site]
gap_tiles = 2
search_radius_tiles = 24

[[order]]
tick = 1
action = "recoger"
player = 0
first = 0
count = 3
resource = "madera"

[[order]]
tick = 1
action = "recoger"
player = 0
first = 3
count = 2
resource = "comida"

[[order]]
tick = 1
action = "entrenar"
player = 0
building = "centro_urbano"
unit = "aldeano"
count = 3

[[order]]
tick = 600
action = "construir"
player = 0
first = 3
count = 1
building = "casa"


# Dos aldeanos a dar un paseo largo (HPA*) mientras la IA juega su partida.
[[order]]
tick = 1500
action = "mover"
player = 0
first = 0
count = 2
target = [128, 128]
