# Configuración de arranque del motor.
# Convención de data/: solo enteros. Una magnitud fraccionaria se escribe en una
# unidad menor que figura en el nombre de la clave (_milli = milésimas).
# Todas las duraciones de la simulación van en ticks (20 ticks = 1 segundo).

[window]
title = "RTS (nombre provisional)"
width = 1600
height = 900
vsync = true

[loop]
# Ticks de simulación máximos por fotograma. Con 5 ticks (250 ms de juego), un
# fotograma de más de 250 ms descarta el retraso en lugar de encadenar fotogramas
# cada vez más lentos (espiral de la muerte).
max_ticks_per_frame = 5

[map]
width_tiles = 256
height_tiles = 256
seed = 20260924
# Separación de la retícula del ruido de la primera octava; la segunda usa la mitad.
# Más grande = continentes más amplios.
noise_cell_tiles = 32
# Niveles de altura (0..7). En M1 solo sombrean; el relieve real llega con M4.
elevation_levels = 8

# Bandas de elevación del generador, de 0 a 65536, en orden creciente. Cada casilla
# recibe el terreno de la primera banda cuyo max_elevation supera su elevación.
[[map.bands]]
terrain = "agua_profunda"
max_elevation = 18000

[[map.bands]]
terrain = "agua"
max_elevation = 24000

[[map.bands]]
terrain = "arena"
max_elevation = 26500

[[map.bands]]
terrain = "pradera"
max_elevation = 40000

[[map.bands]]
terrain = "bosque"
max_elevation = 47000

[[map.bands]]
terrain = "colinas"
max_elevation = 53000

[[map.bands]]
terrain = "roca"
max_elevation = 65536

# Jugadores, en orden de PlayerId. start: centro deseado del edificio inicial (se
# busca el sitio válido más cercano). color: RGB del dueño en marcadores y edificios.
# controller: "humano" (el jugador local es el 0) o "ia".
[[player]]
start = [72, 72]
color = [70, 130, 235]
controller = "humano"

[[player]]
start = [184, 184]
color = [225, 70, 60]
controller = "ia"
ai_profile = "normal"

[demo]
# Unidades sueltas de prueba (las usan el banco y las pruebas de movimiento): count
# unidades del tipo indicado, del jugador indicado, en casillas transitables de un
# cuadrado centrado en el mapa. En la partida normal, ninguna.
seed = 20260924
unit = "leva"
player = 0
count = 0
area_tiles = 32

[economy]
# Ticks por unidad recogida (20 ticks = 1 s): 55 ticks = 0,36 madera/s por aldeano.
gather_ticks = { comida = 50, madera = 55, piedra = 70, oro = 65, hierro = 70 }
# Un aldeano trabaja sobre un objeto si el borde de su disco está a menos de 0,8
# casillas del borde de la huella. Con radio 0,25, el centro puede estar a 1,05: basta
# con llegar a cualquier casilla vecina, también en diagonal (0,71 desde su centro),
# aunque se detenga a 0,25 del centro por el radio de llegada del movimiento.
interact_range_milli_tiles = 800
# Al agotarse un nodo, busca otro del mismo recurso a esta distancia del anterior.
retarget_radius_tiles = 10
# Casillas de acceso distintas que prueba antes de cambiar de nodo o rendirse.
approach_attempts = 3
# Aldeanos por casilla de un nodo: 2 en un árbol, 8 en una mina de 2x2. Más se
# estorban; los que sobran van al nodo accesible más cercano con sitio.
gatherers_per_tile = 2
queue_capacity = 5
max_population = 200
# Anillos alrededor de un edificio donde busca sitio la unidad recién producida.
spawn_search_radius_tiles = 4
# Reparar un edificio entero cuesta el 50 % de su coste en madera (proporcional a la
# vida que se devuelve); al terminar, un edificio quemado vuelve a funcionar.
repair_cost_percent = 50
# Escombros: lo derribado por asedio o desmontado deja en su solar el 50 % del coste
# de su material (piedra o madera), para recoger y transportar. Lo quemado, nada.
salvage_percent = 50
rubble_stone = "escombros_piedra"
rubble_wood = "escombros_madera"

[fire]
# Intensidad de 0 a 1000. Por debajo de 200 un fuego mengua 2 por tick y se apaga
# solo: hacen falta varios golpes de antorcha seguidos. Por encima crece solo: la
# madera, 4 por tick (de 200 al máximo en 10 s); la piedra, 2.
max_intensity = 1000
sustain_intensity = 200
decay_per_tick = 2
growth_wood_per_tick = 4
growth_stone_per_tick = 2
# Vida quemada por tick a intensidad máxima (milésimas): una casa de 550 de vida sin
# atender cae en unos 45 s desde que prende.
burn_wood_milli_hp_per_tick = 750
burn_stone_milli_hp_per_tick = 500
# La piedra no baja del 60 % de su vida por el fuego: queda quemada e inutilizada.
stone_floor_percent = 60
# Desde 800 prende a los edificios de madera a 1 casilla o menos: 3 por tick.
spread_intensity = 800
spread_per_tick = 3
spread_gap_tiles = 1
# Para apagar basta con estar a 0,8 casillas del borde del edificio.
extinguish_reach_milli_tiles = 800

[supply]
# Logística. Un ejército no vive del aire: cada unidad lleva raciones (units.toml:
# rations, ration_ticks) y los tiradores, munición (ammo). Se reponen poco a poco
# junto a un edificio propio que abastece (buildings.toml: supplies), pagando del
# almacén del jugador. La munición no se encuentra sobre el terreno: hay que llevarla.
# A 4 casillas o menos del edificio, como mucho una reposición por segundo y unidad:
# una ración (1 de comida) y un haz de munición (coste en units.toml).
resupply_radius_tiles = 4
resupply_interval_ticks = 20
ration_cost = { comida = 1 }
# Hambre (sin raciones): ataque al 60 %, los aldeanos trabajan a la mitad. Tras 1 min
# de hambre las tropas pierden 1 de vida cada 3 s hasta morir; los aldeanos, no.
hungry_attack_percent = 60
hungry_work_percent = 50
starve_after_ticks = 1200
starve_hp_interval_ticks = 60

[combat]
# Cada unidad busca blanco cada 10 ticks (0,5 s), repartidas por id.
acquire_interval_ticks = 10
# Se recalcula la persecución si el blanco se alejó 2 casillas o más.
repath_tiles = 2
# Si una persecución acaba 3 veces sin alcanzar a un blanco quieto, se abandona.
chase_attempts = 3
# Contra edificios, 0,6 casillas de alcance extra: el que llega a una casilla vecina de
# la huella se para cerca de su centro (hasta ~0,75 casillas del borde).
building_reach_milli_tiles = 600
# Un proyectil acierta a una unidad si cae a menos de su radio + 0,15 casillas.
projectile_hit_radius_milli_tiles = 150
# Experiencia: 1 por punto de daño hecho, más 20 por cada baja en la que participe.
xp_kill_bonus = 20
# 12 niveles, como en Tzar; el último convierte a la unidad en héroe.
level_thresholds = [30, 70, 120, 180, 260, 360, 480, 620, 780, 960, 1160, 1400]
# Cada nivel: +8 % de vida y +6 % de ataque sobre la base; +1 de armadura cada 3 niveles.
hp_percent_per_level = 8
attack_percent_per_level = 6
armor_every_levels = 3
# Aura de héroe: +15 % de ataque a las unidades propias a menos de 4 casillas (no se acumula).
hero_aura_radius_milli_tiles = 4000
hero_aura_attack_percent = 15
# Nombres propios de los héroes, en el orden en que aparecen (se reutilizan al acabarse).
hero_names = ["Brunilda", "Rodrigo el Tenaz", "Urraca", "Sancho Barbanegra", "Elvira de la Torre", "Tello", "Jimena", "Nuño el Callado"]

[ai]
# La IA juega con las mismas reglas, costes e información que un humano (sin trampas).
# Decide una vez por segundo.
think_interval_ticks = 20
# Tipos que usa (dependerán de la civilización, no de la dificultad).
worker = "aldeano"
house = "casa"
barracks = "cuartel"
farm = "granja"
# Taller de asedio (módulo taller).
workshop = "taller_asedio"
dropoff = { comida = "molino", madera = "aserradero", piedra = "campamento_minero", oro = "campamento_minero", hierro = "campamento_minero" }

# Perfiles: cada jugador de la IA elige uno con ai_profile en [[player]]. La
# dificultad sale de qué módulos usa y de sus umbrales, nunca de ventajas económicas.
# Módulos: defensa, aldeanos, casas, cuartel, granjas, almacenes, obras,
# recoleccion, ejercito, ataque, ejercito_contra, ataque_fuerza, concentrar, taller,
# apagar, incendiar, abastecer. Se ejecutan en el orden de la lista.
[[ai.profile]]
name = "basica"
behaviors = ["defensa", "abastecer", "aldeanos", "casas", "cuartel", "granjas", "almacenes", "obras", "recoleccion", "ejercito", "ataque"]
villager_target = 25
# Reparto deseado de los aldeanos que recogen (suma 100).
gather_percent = { comida = 35, madera = 30, oro = 15, piedra = 5, hierro = 15 }
# Casa nueva cuando le quedan 3 plazas o menos de población.
house_margin = 3
barracks_at_villagers = 10
# Almacén junto a un recurso que ya explotan 3 aldeanos si el más cercano está a más de 12 casillas.
dropoff_distance_tiles = 12
dropoff_min_gatherers = 3
builders = 2
# Una granja por cada 2 aldeanos que deban recoger comida.
gatherers_per_farm = 2
# Una casilla libre alrededor de cada edificio para no cerrar pasillos.
build_gap_tiles = 1
build_search_radius_tiles = 24
# Primer ataque con 6 unidades; cada oleada, 4 más.
first_wave = 6
wave_growth = 4
# Enemigos a 14 casillas o menos de su base: defensa. Un aldeano con un enemigo a 3
# casillas o menos huye a la base, salvo que ya esté a 2 o menos de ella.
defend_radius_tiles = 14
flee_enemy_tiles = 3
safe_base_tiles = 2
# Unidades en cola que mantiene en el cuartel.
barracks_queue = 2
villager_queue = 1
# Solo para ataque_fuerza (no lo usa este perfil).
attack_ratio_percent = 130
retreat_ratio_percent = 60
min_attack_army = 6
engage_radius_tiles = 8
# Sin apagar fuegos ni incursiones (no usa esos módulos).
extinguishers_per_fire = 0
army_min_villagers = 0
raid_unit = ""
raid_group = 1
raid_safe_radius_tiles = 0
# abastecer: la tropa que no pelea vuelve a abastecerse con menos del 30 % de víveres
# o munición (y espera junto al almacén a llenarse).
resupply_percent = 30
army = ["leva", "hombre_armas", "arquero"]

# Perfil por defecto: mismos costes y reglas, mejores decisiones. Ejército según el
# rival, ataque cuando su fuerza supera a la enemiga (y retirada si pierde la
# batalla), fuego concentrado, dos aldeanos en cola y casas con más margen.
[[ai.profile]]
name = "normal"
behaviors = ["defensa", "apagar", "concentrar", "abastecer", "ataque_fuerza", "incendiar", "aldeanos", "casas", "cuartel", "taller", "granjas", "almacenes", "obras", "recoleccion", "ejercito_contra"]
villager_target = 30
gather_percent = { comida = 35, madera = 45, oro = 5, piedra = 0, hierro = 15 }
house_margin = 5
barracks_at_villagers = 8
dropoff_distance_tiles = 12
dropoff_min_gatherers = 3
builders = 2
gatherers_per_farm = 2
build_gap_tiles = 1
build_search_radius_tiles = 24
# Oleadas fijas: no las usa (ataca por fuerza).
first_wave = 6
wave_growth = 4
defend_radius_tiles = 14
flee_enemy_tiles = 3
safe_base_tiles = 2
barracks_queue = 2
villager_queue = 2
# Ataca con 6 o más tropas ociosas si su fuerza es al menos el 130 % de la enemiga
# conocida; se retira si, a 8 casillas de su ejército en campaña, baja del 60 %.
attack_ratio_percent = 130
retreat_ratio_percent = 60
min_attack_army = 6
engage_radius_tiles = 8
# apagar: 3 aldeanos por edificio en llamas. incendiar: grupos de 3 jinetes contra
# edificios de madera sin enemigos armados a 10 casillas.
extinguishers_per_fire = 3
# Hasta 20 aldeanos solo entrena tropas si su ejército es más débil que el enemigo.
army_min_villagers = 20
raid_unit = "jinete"
raid_group = 3
raid_safe_radius_tiles = 10
resupply_percent = 30
army = ["leva", "hombre_armas", "arquero", "ballestero", "jinete", "caballero", "ariete", "zapador"]

[setup]
seed = 20260924
# Radio de búsqueda del sitio del edificio inicial y tamaño mínimo de su región de
# tierra (evita empezar en un islote).
start_search_radius_tiles = 48
min_start_region_tiles = 4000
start_building = "centro_urbano"
start_unit = "aldeano"
start_units = 5
start_stock = { comida = 200, madera = 200, piedra = 150, oro = 100 }
# Bosques: un árbol en el 55 % de las casillas de bosque, salvo en un claro de 8
# casillas alrededor de cada inicio.
forest_terrain = "bosque"
tree = "arbol"
tree_density_permille = 550
clear_radius_tiles = 8

# Recursos garantizados junto a cada inicio (distancias de Chebyshev al centro del
# edificio inicial). El primero de cada grupo cae al azar en el anillo; el resto se
# agrupa a su lado.
[[setup.near_start]]
node = "arbusto_bayas"
count = 6
min_distance_tiles = 5
max_distance_tiles = 8

[[setup.near_start]]
node = "mina_oro"
count = 1
min_distance_tiles = 8
max_distance_tiles = 12

[[setup.near_start]]
node = "mina_piedra"
count = 1
min_distance_tiles = 8
max_distance_tiles = 12

[[setup.near_start]]
node = "mina_hierro"
count = 1
min_distance_tiles = 8
max_distance_tiles = 12

[[setup.near_start]]
node = "arbol"
count = 20
min_distance_tiles = 9
max_distance_tiles = 14

[movement]
# HPA*: sectores de 16x16 casillas; un tramo de borde transitable más ancho que
# max_portal_width_tiles se parte en varios portales.
sector_size_tiles = 16
max_portal_width_tiles = 8
# Nodos de rejilla que el planificador puede expandir por tick. Se mide en nodos y no
# en tiempo para que el reparto entre ticks sea idéntico en todas las máquinas.
# Medido con rts_bench en Release: el peor tick es de 18,0 ms con 1000 unidades y de
# 19,1 ms con 2000 (con 20 000 nodos: 10,1 y 15,9 ms), a cambio de menos caminos
# esperando turno (máximo 1861 frente a 1951 con 2000 unidades).
path_node_budget_per_tick = 60000
# Una orden a 8 unidades o más usa un campo de flujo compartido en lugar de 8 A*.
flow_field_min_group = 8
flow_field_cache_size = 4
# Si el destino no es alcanzable (agua, otra isla), se busca la casilla alcanzable más
# cercana en este radio.
retarget_radius_tiles = 16
# Evitación local (RVO muestreado): vecinas a menos de 2 casillas, como mucho 8.
neighbor_radius_milli_tiles = 2000
max_neighbors = 8
# Horizonte de anticipación: colisiones previstas a más de 20 ticks (1 s) no penalizan.
time_horizon_ticks = 20
# Peso de desviarse de la velocidad deseada frente al de acercarse a una colisión.
preference_weight = 100
collision_weight = 60
# Atasco: 40 ticks (2 s) casi parada junto a una compañera ya llegada = llegada;
# 160 ticks (8 s) atascada = desiste.
stuck_arrive_ticks = 40
# Llegada: a 0,25 casillas del destino; en ruta, a 0,45 casillas de una casilla del
# tramo se pasa a la siguiente.
arrive_radius_milli_tiles = 250
waypoint_radius_milli_tiles = 450

[view]
# Proyección isométrica 2:1: cada casilla es un rombo de 64x32 píxeles.
tile_width_px = 64
tile_height_px = 32
# Radio de los marcadores de prueba.
marker_radius_px = 5
# Sombreado por altura: el nivel 0 se pinta al 72 % de brillo y el máximo al 100 %;
# cada nivel de diferencia con la casilla de detrás suma o resta un 8 % (luz del norte).
elevation_shade_min_percent = 72
hillshade_step_percent = 8
# Colores provisionales [r, g, b, a], 0-255.
clear_color = [18, 20, 26, 255]
debug_overlay_color = [80, 160, 255, 110]
marker_selected_color = [120, 255, 140, 255]
selection_rect_color = [120, 255, 140, 48]
hover_tile_color = [255, 255, 255, 56]
# Objetos estáticos: el rombo interior de un edificio ocupa el 70 % del lado de su
# huella (el borde visible es el color del jugador); el de un recurso, el 80 %. Un
# edificio en obra se pinta al 45 % de brillo.
building_body_percent = 70
node_body_percent = 80
construction_shade_percent = 45
# Fantasma de colocación: verde si el sitio es válido y alcanza el dinero, rojo si no.
ghost_valid_color = [120, 255, 140, 120]
ghost_invalid_color = [255, 80, 80, 120]
# Punto sobre un aldeano que lleva algo, según el recurso.
resource_colors = { comida = [232, 96, 120, 255], madera = [150, 104, 60, 255], piedra = [200, 200, 205, 255], oro = [250, 212, 64, 255], hierro = [120, 132, 148, 255] }
# Barras de vida (unidades heridas o seleccionadas, edificios dañados): 20x3 píxeles,
# en rojo por debajo del 35 %.
health_bar_width_px = 20
health_bar_height_px = 3
health_low_permille = 350
health_back_color = [20, 20, 20, 200]
health_color = [90, 220, 90, 255]
health_low_color = [230, 70, 50, 255]
projectile_color = [245, 240, 220, 255]
hero_color = [255, 200, 40, 255]
# Un edificio en llamas tiende al naranja según la intensidad; uno quemado se pinta
# al 30 % de brillo.
fire_color = [255, 110, 20, 255]
burned_shade_percent = 30

[camera]
scroll_keys_px_per_s = 1200
scroll_edge_px_per_s = 1200
# Distancia al borde de la ventana a la que empieza el scroll con el ratón.
edge_margin_px = 6

[selection]
# Un arrastre menor que esto cuenta como clic.
drag_threshold_px = 4
# Distancia máxima entre el clic y un marcador para seleccionarlo.
click_radius_px = 10

[replay]
# Hash de estado grabado cada 10 s de juego: al verificar, una divergencia se localiza
# con esta resolución.
checkpoint_interval_ticks = 200
# Cada partida se graba sola en esta carpeta, junto al ejecutable.
directory = "replays"
# Velocidades del reproductor (teclas 1, 2, 3, 4).
speeds = [1, 2, 4, 8]
