# Espera a que se unan todos los jugadores.
lobby_timeout_ms = 120000
# El invitado reintenta conectar cada 100 ms durante 30 s (el anfitrión puede tardar en abrir).
connect_timeout_ms = 30000
connect_retry_ms = 100
# Trama más larga admitida (protege de un otro extremo roto o malicioso).
max_frame_bytes = 1048576
max_players = 4
# Charla: un mensaje de más de 200 bytes se corta; se guardan las últimas 50 líneas.
chat_max_chars = 200
chat_history = 50
# Espera máxima por vuelta del bucle mientras faltan órdenes (no gasta CPU en vano).
poll_wait_ms = 5
# Puerto y dirección que proponen el menú y la sala (se pueden cambiar allí).
default_port = 47000
default_address = "127.0.0.1"

[net.probe]
# Órdenes de prueba de las partidas en red sin ventana: cada 2 s, hasta 3 unidades
# propias al azar se mueven a como mucho 6 casillas.
every_ticks = 40
units = 3
radius_tiles = 6
