[net]
# Partidas en red por lockstep (E1). Turnos de 4 ticks = 200 ms; una orden se ejecuta
# 2 turnos después de darse (entre 200 y 400 ms), en el mismo tick en todas las
# máquinas. Es el esquema de Age of Empires (Bettner y Terrano, 2001).
turn_ticks = 4
input_delay_turns = 2
# Hash de estado cada 5 turnos (1 s): una desincronización se localiza con esa precisión.
hash_every_turns = 5
# Sin las órdenes de otro jugador durante 30 s, la partida se da por perdida.
