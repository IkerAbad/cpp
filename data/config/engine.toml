# Configuración de arranque del motor.
# Convención de data/: solo enteros. Una magnitud fraccionaria se escribe en una
# unidad menor que figura en el nombre de la clave (_milli = milésimas).
# Todas las duraciones de la simulación van en ticks (20 ticks = 1 segundo).

[window]
title = "RTS (nombre provisional)"
width = 1600
height = 900
vsync = true

[loop]
# Ticks de simulación máximos por fotograma. Con 5 ticks (250 ms de juego), un
# fotograma de más de 250 ms descarta el retraso en lugar de encadenar fotogramas
# cada vez más lentos (espiral de la muerte).
max_ticks_per_frame = 5

[map]
width_tiles = 256
height_tiles = 256
seed = 20260924
# Separación de la retícula del ruido de la primera octava; la segunda usa la mitad.
# Más grande = continentes más amplios.
noise_cell_tiles = 32
# Niveles de altura (0..7). En M1 solo sombrean; el relieve real llega con M4.
elevation_levels = 8

# Bandas de elevación del generador, de 0 a 65536, en orden creciente. Cada casilla
# recibe el terreno de la primera banda cuyo max_elevation supera su elevación.
[[map.bands]]
terrain = "agua_profunda"
max_elevation = 18000

[[map.bands]]
terrain = "agua"
max_elevation = 24000

[[map.bands]]
terrain = "arena"
max_elevation = 26500

[[map.bands]]
terrain = "pradera"
max_elevation = 40000

[[map.bands]]
terrain = "bosque"
max_elevation = 47000

[[map.bands]]
terrain = "colinas"
max_elevation = 53000

[[map.bands]]
terrain = "roca"
max_elevation = 65536

# Ríos (F3): de un borde al opuesto, con meandros (en cada paso, un 35 % de probabilidad
# de desviarse una casilla), a más de 40 casillas de los inicios y con vados de agua
# somera repartidos a lo largo. En el mapa por defecto, ninguno; los tipos de mapa de
# abajo los ponen.
[map.rivers]
count = 0
width_tiles = 4
fords = 2
ford_length_tiles = 5
meander_percent = 35
clearance_tiles = 40
bed_level = 0
water = "agua"
ford = "vado"
# Orillas de cada vado despejadas (sin bosque) 3 casillas a cada lado.
landing = "pradera"
landing_tiles = 3

# Tipos de mapa que se eligen en el menú. Cada uno cambia solo lo que dice.
[[map.preset]]
name = "Continental"
rivers = 0

[[map.preset]]
name = "Ríos"
rivers = 2

[[map.preset]]
name = "Gran río"
rivers = 1
river_width_tiles = 7
fords = 3

# Jugadores, en orden de PlayerId. start: centro deseado del edificio inicial (se
# busca el sitio válido más cercano). color: RGB del dueño en marcadores y edificios.
# controller: "humano" (el jugador local es el 0), "ia" o "libre" (un puesto que solo
# se ocupa en las partidas en red de más de dos; los libres van al final).
[[player]]
start = [72, 72]
color = [70, 130, 235]
controller = "humano"

[[player]]
start = [184, 184]
color = [225, 70, 60]
controller = "ia"
ai_profile = "normal"

[[player]]
start = [184, 72]
color = [235, 200, 60]
controller = "libre"

[[player]]
start = [72, 184]
color = [90, 190, 110]
controller = "libre"

[demo]
# Unidades sueltas de prueba (las usan el banco y las pruebas de movimiento): count
# unidades del tipo indicado, del jugador indicado, en casillas transitables de un
# cuadrado centrado en el mapa. En la partida normal, ninguna.
seed = 20260924
unit = "leva"
player = 0
count = 0
area_tiles = 32

[economy]
# Ticks por unidad recogida (20 ticks = 1 s): 55 ticks = 0,36 madera/s por aldeano.
gather_ticks = { comida = 50, madera = 55, piedra = 70, oro = 65, hierro = 70 }
# Un aldeano trabaja sobre un objeto si el borde de su disco está a menos de 0,8
# casillas del borde de la huella. Con radio 0,25, el centro puede estar a 1,05: basta
# con llegar a cualquier casilla vecina, también en diagonal (0,71 desde su centro),
# aunque se detenga a 0,25 del centro por el radio de llegada del movimiento.
interact_range_milli_tiles = 800
# Al agotarse un nodo, busca otro del mismo recurso a esta distancia del anterior.
retarget_radius_tiles = 10
# Casillas de acceso distintas que prueba antes de cambiar de nodo o rendirse.
approach_attempts = 3
# Aldeanos por casilla de un nodo: 2 en un árbol, 8 en una mina de 2x2. Más se
# estorban; los que sobran van al nodo accesible más cercano con sitio.
gatherers_per_tile = 2
queue_capacity = 5
max_population = 200
# Anillos alrededor de un edificio donde busca sitio la unidad recién producida.
spawn_search_radius_tiles = 4
# Reparar un edificio entero cuesta el 50 % de su coste en madera (proporcional a la
# vida que se devuelve); al terminar, un edificio quemado vuelve a funcionar.
repair_cost_percent = 50
# Escombros: lo derribado por asedio o desmontado deja en su solar el 50 % del coste
# de su material (piedra o madera), para recoger y transportar. Lo quemado, nada.
salvage_percent = 50
rubble_stone = "escombros_piedra"
rubble_wood = "escombros_madera"
# Brecha (F4): lo derribado de un muro o una puerta no cierra el paso; se asalta por
# encima de los escombros, que se pueden seguir recogiendo.
breach_stone = "brecha_piedra"
breach_wood = "brecha_madera"

[fire]
# Intensidad de 0 a 1000. Por debajo de 200 un fuego mengua 2 por tick y se apaga
# solo: hacen falta varios golpes de antorcha seguidos. Por encima crece solo: la
# madera, 4 por tick (de 200 al máximo en 10 s); la piedra, 2.
max_intensity = 1000
sustain_intensity = 200
decay_per_tick = 2
growth_wood_per_tick = 4
growth_stone_per_tick = 2
# Vida quemada por tick a intensidad máxima (milésimas): una casa de 550 de vida sin
# atender cae en unos 45 s desde que prende.
burn_wood_milli_hp_per_tick = 750
burn_stone_milli_hp_per_tick = 500
# La piedra no baja del 60 % de su vida por el fuego: queda quemada e inutilizada.
stone_floor_percent = 60
# Desde 800 prende a los edificios de madera a 1 casilla o menos: 3 por tick.
spread_intensity = 800
spread_per_tick = 3
spread_gap_tiles = 1
# Para apagar basta con estar a 0,8 casillas del borde del edificio.
extinguish_reach_milli_tiles = 800

[supply]
# Logística. Un ejército no vive del aire: cada unidad lleva raciones (units.toml:
# rations, ration_ticks) y los tiradores, munición (ammo). Se reponen poco a poco
# junto a un edificio propio que abastece (buildings.toml: supplies), pagando del
# almacén del jugador. La munición no se encuentra sobre el terreno: hay que llevarla.
# A 4 casillas o menos del edificio, como mucho una reposición por segundo y unidad:
# una ración (1 de comida) y un haz de munición (coste en units.toml).
resupply_radius_tiles = 4
resupply_interval_ticks = 20
ration_cost = { comida = 1 }
# Hambre (sin raciones): ataque al 60 %, los aldeanos trabajan a la mitad. Tras 1 min
# de hambre las tropas pierden 1 de vida cada 3 s hasta morir; los aldeanos, no.
# Convoyes: la carga de una acémila o carreta es 70 % comida, 20 % madera y 10 %
# hierro (raciones y munición); cargar o descargar lleva 3 s; basta con estar a 0,8
# casillas del borde del edificio.
convoy_mix = { comida = 70, madera = 20, hierro = 10 }
load_ticks = 60
convoy_reach_milli_tiles = 800
# Forrajeo y saqueo (C2): la tropa parada, sin pelear y sin fuente propia cerca vive del
# terreno a 2 casillas: del grano de las granjas enemigas, que se vacían, y de la
# comida del rival junto a sus almacenes (al ritmo del reabastecimiento, una ración
# por cada 1 de comida); si no, del bosque, gratis pero una ración cada 2 min. Es la
# «chevauchée»: «a raiding method of medieval warfare for weakening the enemy,
# primarily by burning and pillaging enemy territory in order to reduce the
# productivity of a region» (Wikipedia, «Chevauchée»).
forage = true
forage_reach_tiles = 2
forest_forage_ticks = 2400
hungry_attack_percent = 60
hungry_work_percent = 50
starve_after_ticks = 1200
starve_hp_interval_ticks = 60

[alerts]
# Avisos al jugador (le atacan, algo arde, hambre, sin comida, unidad lista). El mismo
# aviso en la misma zona de 16 casillas no se repite antes de 20 s; cada uno se ve
# 8 s y como mucho 4 a la vez. Espacio lleva la cámara al último.
cooldown_ticks = 400
zone_tiles = 16
show_ticks = 160
max_shown = 4

[vision]
# Niebla de guerra: solo se sabe lo que alguien ha visto, y lo mismo para la IA. Se
# recalcula cada 10 ticks (0,5 s).
enabled = true
interval_ticks = 10
# Altura: 1 casilla más de vista por cada nivel que el observador está por encima de
# lo que mira; una loma más alta que ambos tapa lo que hay detrás.
elevation_sight_per_level = 1
# Árboles: se ve hasta 2 casillas dentro del bosque; una unidad entre árboles solo se
# ve a 2 casillas o menos (emboscadas). Talar abre la vista.
cover_depth_tiles = 2
spot_in_cover_tiles = 2
# Día de 12 min de luz (1,5 min de amanecer y otro de anochecer) y noche de 6 min con
# la vista a la mitad. La partida empieza 2 min después del alba.
day_ticks = 14400
night_ticks = 7200
twilight_ticks = 1800
night_sight_percent = 50
start_tick = 2400

[terrain]
# Terreno en combate (B2). Los valores por tipo de terreno están en terrain.toml.
# Altura: «soldiers who are elevated above their enemies can get greater range out of
# low-speed projectiles (such as rocks, javelins/spears, arrows ...)» y «soldiers
# fighting uphill are assumed to tire more quickly and will move more slowly»
# (Wikipedia, «High ground»).
enabled = true
# Cada nivel de altura de ventaja (hasta 3) da al tirador media casilla más de alcance
# y un 10 % más de daño; cuesta arriba, al revés (el alcance no baja de la mitad).
range_per_level_milli_tiles = 500
max_levels = 3
ranged_percent_per_level = 10
# Cuerpo a cuerpo, un 10 % por nivel: pelear cuesta arriba cansa.
melee_percent_per_level = 10
# Carga: 1 s seguido en marcha antes del golpe.
charge_run_ticks = 20

[garrison]
# Guarnición de torres (B4): se entra estando a 0,8 casillas o menos de la huella.
enter_reach_milli_tiles = 800

[climb]
# Escalas de asedio (B4). Cada escalador lleva su escala, de 15 de madera, pagada al dar
# la orden. Tarda 5 s en subir y, en lo alto, sin cubrirse, recibe un 50 % más de daño.
ladder_cost = { madera = 15 }
climb_ticks = 100
reach_milli_tiles = 800
exposed_percent = 150

[formation]
# Formaciones (B5): valen con al menos 4 en la misma formación a 3 casillas o menos;
# al moverse, cada una va a su puesto, a 1 casilla de las vecinas.
# Cuadro: el erizo de picas del «schiltron», «the thick-set grove of twelve foot spears
# was far too dense for the cavalry to penetrate» (Wikipedia, «Schiltron»): anula la
# carga y la caballería le hace la mitad; lento, y blanco fácil para los arqueros
# (Falkirk, 1298): las flechas le hacen un 25 % más.
# Columna: marcha un 15 % más rápido (valor de diseño: así se marchaba, pero no tengo
# una fuente medieval que lo cifre); desplegada pega un 20 % menos y la caballería que
# la pilla de lado, un 20 % más.
# Línea: todos con tiro libre: los tiradores hieren un 20 % más; marcha al 90 %.
enabled = true
min_members = 4
cohesion_milli_tiles = 3000
spacing_milli_tiles = 1000
cavalry_class = "caballeria"

[formation.line]
speed_percent = 90
melee_attack_percent = 100
ranged_attack_percent = 120
cavalry_taken_percent = 100
ranged_taken_percent = 100
stops_charge = false

[formation.column]
speed_percent = 115
melee_attack_percent = 80
ranged_attack_percent = 80
cavalry_taken_percent = 120
ranged_taken_percent = 100
stops_charge = false

[formation.square]
speed_percent = 50
melee_attack_percent = 100
ranged_attack_percent = 90
cavalry_taken_percent = 50
ranged_taken_percent = 125
stops_charge = true

[objectives]
# Objetivos de escenario (F4): se comprueban cada 10 ticks (medio segundo).
check_every_ticks = 10

[market]
# Mercado (C3). Lotes de 100; precios en oro por lote, los mismos para todos. Cada
# compra encarece 3 y cada venta abarata 3, entre 10 y 400; cada 5 s vuelven 1 hacia su
# base. Al vender, el mercader se queda un 30 %. Las caravanas ganan 0,4 de oro por
# casilla entre los dos mercados en cada llegada (el comercio de las ferias de
# Champaña, «linked the cloth-producing cities of the Low Countries with the Italian
# dyeing and exporting centers»: Wikipedia, «Champagne fairs»).
enabled = true
lot = 100
base_price = { comida = 50, madera = 50, piedra = 70, hierro = 90 }
price_step = 3
min_price = 10
max_price = 400
sell_fee_percent = 30
recover_interval_ticks = 100
caravan_gold_milli_per_tile = 400
caravan_reach_milli_tiles = 800

[fatigue]
# Fatiga (B3). Cansancio de 0 a 100000 (agotada). Vegetius: «They should march with the
# common military step twenty miles in five summer-hours, and with the full step,
# which is quicker, twenty-four miles in the same number of hours» y «If they exceed
# this pace, they no longer march but run» (De re militari, libro I; Wikipedia,
# «Military step»).
enabled = true
# Marchando en llano, 15 por tick: unos 5,5 min seguidos hasta agotarse (el terreno
# difícil cansa en proporción a lo que frena). Cada golpe dado, 400.
march_per_tick = 15
strike = 400
# Parada, descansa 60 por tick: de agotada a fresca en 1,4 min.
rest_per_tick = 60
# Paso forzado: el «full step», un 20 % más rápido (24 millas contra 20), y cansa el
# triple.
forced_speed_percent = 120
forced_fatigue_percent = 300
# Agotada, anda y pega al 70 %; entre medias, en proporción.
exhausted_speed_percent = 70
exhausted_attack_percent = 70

[morale]
# Moral y desbandada (B1). Moral de 0 a 1000; las pérdidas se escalan por la firmeza
# del tipo (units.toml, morale_resolve). Las batallas se decidían por la huida, no por
# la muerte de todos: en Queronea, según Ardant du Picq, «The Romans lost fourteen men,
# and killed their enemies until worn out in pursuit». Lo que más hacía huir era el
# ataque por sorpresa, por el flanco o la retaguardia: «it was almost always an attack
# from the flank or rear, a surprise action, that won battles». Y el pánico se
# contagia: «The appearance of a troop B on one flank determined the flight of A»
# (Ardant du Picq, «Battle Studies», 1880; Project Gutenberg, libro 7294).
enabled = true
# Todas las unidades revisan su moral a la vez cada 10 ticks (0,5 s).
interval_ticks = 10
# Por debajo de 250 se desbanda; se rehace al volver a 600 sin enemigos a 8 casillas.
rout_below = 250
rally_above = 600
# Bajas, compañeros y enemigos que cuentan: a 6 casillas o menos.
awareness_milli_tiles = 6000
rally_safe_milli_tiles = 8000
# Cada baja propia cercana quita 60; cada baja enemiga cercana anima 20.
casualty_loss = 60
enemy_casualty_gain = 20
# Un golpe de frente apenas pesa (4); uno de flanco o por la espalda, mucho (25).
hit_loss = 4
flank_hit_loss = 25
# La muerte de un héroe quita 300 a los suyos en 12 casillas.
hero_death_loss = 300
hero_death_milli_tiles = 12000
# En cada revisión: 10 por cada compañero cercano que huye (contagio), 8 si hay más
# enemigos que compañeros cerca y 1 con hambre (el hambre mina poco a poco).
contagion_loss = 10
outnumbered_loss = 8
hungry_loss = 1
# En calma (10 s sin recibir daño y sin pérdidas en la revisión) se recupera 10, más
# 2 por compañero cercano (hasta 8) y 10 con un héroe cerca. Con un héroe cerca las
# pérdidas se quedan en el 70 %; de noche pesan un 30 % más.
calm_ticks = 200
calm_gain = 10
comrade_gain = 2
comrade_cap = 8
hero_gain = 10
hero_loss_percent = 70
night_loss_percent = 130
# Huyendo y sin enemigos cerca recupera 20 por revisión (unos 9 s hasta rehacerse).
routing_gain = 20
# Huye 10 casillas lejos del enemigo y cada 2 s vuelve a mirar hacia dónde. Al
# rehacerse, 10 s reorganizándose antes de volver a pelear.
flee_tiles = 10
flee_repath_ticks = 40
rally_reorganize_ticks = 200

[medicine]
# Sanidad. Un paciente ingresado mejora por el reposo 5 milésimas de vida por tick
# (1 punto cada 10 s) y, si le atiende un enfermero, 30 más; cada enfermero atiende a
# 3 pacientes. care_percent del puesto escala ese ritmo. Un soldado de 40 de vida con
# 30 de herida tarda unos 45 s atendido en un hospital de campaña y 5 min sin atender.
# Los pacientes comen como un aldeano (1 ración cada 2 min). Tras el alta, 20 s sin
# poder atacar (reorganizarse y armarse; sale sin víveres ni munición).
bed_heal_milli_hp_per_tick = 5
nurse_heal_milli_hp_per_tick = 30
patients_per_nurse = 3
patient_ration_ticks = 2400
reorganize_ticks = 400
care_reach_milli_tiles = 800
# Heridas leves (vida en el 70 % o más): sanan solas 1 punto cada 10 s, comida la
# unidad y tras 10 s sin recibir daño. Las graves no: necesitan un puesto médico.
light_wound_percent = 70
natural_heal_interval_ticks = 200
calm_ticks = 200

[combat]
# Cada unidad busca blanco cada 10 ticks (0,5 s), repartidas por id.
acquire_interval_ticks = 10
# Se recalcula la persecución si el blanco se alejó 2 casillas o más.
repath_tiles = 2
# Si una persecución acaba 3 veces sin alcanzar a un blanco quieto, se abandona.
chase_attempts = 3
# Contra edificios, 0,6 casillas de alcance extra: el que llega a una casilla vecina de
# la huella se para cerca de su centro (hasta ~0,75 casillas del borde).
building_reach_milli_tiles = 600
# Un proyectil acierta a una unidad si cae a menos de su radio + 0,15 casillas.
projectile_hit_radius_milli_tiles = 150
# Experiencia: 1 por punto de daño hecho, más 20 por cada baja en la que participe.
xp_kill_bonus = 20
# 12 niveles, como en Tzar; el último convierte a la unidad en héroe.
level_thresholds = [30, 70, 120, 180, 260, 360, 480, 620, 780, 960, 1160, 1400]
# Cada nivel: +8 % de vida y +6 % de ataque sobre la base; +1 de armadura cada 3 niveles.
hp_percent_per_level = 8
attack_percent_per_level = 6
armor_every_levels = 3
# Aura de héroe: +15 % de ataque a las unidades propias a menos de 4 casillas (no se acumula).
hero_aura_radius_milli_tiles = 4000
hero_aura_attack_percent = 15
# Nombres propios de los héroes, en el orden en que aparecen (se reutilizan al acabarse).
hero_names = ["Brunilda", "Rodrigo el Tenaz", "Urraca", "Sancho Barbanegra", "Elvira de la Torre", "Tello", "Jimena", "Nuño el Callado"]
# Prioridad al elegir blanco solo (la misma para el jugador y para la IA): primero
# quien me ataca (autopreservación), luego lo armado que puede herir a la tropa, los
# ingenios de asedio, el bagaje y los aldeanos; dentro de cada clase, el más cercano.
# Valen: me_ataca, armada, asedio, bagaje, aldeano, otra.
target_priority = ["me_ataca", "armada", "asedio", "bagaje", "aldeano", "otra"]

[ai]
# La IA juega con las mismas reglas, costes e información que un humano (sin trampas).
# Decide una vez por segundo.
think_interval_ticks = 20
# Con niebla, el ejército enemigo visto se recuerda y se va olvidando un 1 % en cada
# decisión (1 s): la mitad en algo más de un minuto, como un jugador que estima.
enemy_memory_decay_permille = 10
# Tipos que usa (dependerán de la civilización, no de la dificultad).
worker = "aldeano"
house = "casa"
barracks = "cuartel"
farm = "granja"
# Taller de asedio (módulo taller).
workshop = "taller_asedio"
# Logística (módulo logistica): campamento de campaña y bagaje de los convoyes.
camp = "campamento"
carrier = "acemila"
# Ingenio de asedio que se monta en el campamento ("" = ninguno).
siege_engine = "trabuquete"
# Sanidad (módulo sanidad): el puesto médico que levanta y el cirujano que forma.
medical_post = "hospital_campana"
surgeon = "cirujano"
# Torres (módulo torres).
tower = "torre_madera"
# Herrería (módulo herreria).
forge = "herreria"
dropoff = { comida = "molino", madera = "aserradero", piedra = "campamento_minero", oro = "campamento_minero", hierro = "campamento_minero" }

# Perfiles: cada jugador de la IA elige uno con ai_profile en [[player]]. La
# dificultad sale de qué módulos usa y de sus umbrales, nunca de ventajas económicas.
# Módulos: defensa, aldeanos, casas, cuartel, granjas, almacenes, obras,
# recoleccion, ejercito, ataque, ejercito_contra, ataque_fuerza, concentrar, taller,
# apagar, incendiar, abastecer, logistica, explorar. Se ejecutan en el orden de la lista.
[[ai.profile]]
name = "facil"
behaviors = ["defensa", "explorar", "abastecer", "aldeanos", "casas", "cuartel", "granjas", "almacenes", "obras", "recoleccion", "ejercito", "ataque"]
villager_target = 25
# Reparto deseado de los aldeanos que recogen (suma 100).
gather_percent = { comida = 35, madera = 30, oro = 15, piedra = 5, hierro = 15 }
# Casa nueva cuando le quedan 3 plazas o menos de población.
house_margin = 3
barracks_at_villagers = 10
# Almacén junto a un recurso que ya explotan 3 aldeanos si el más cercano está a más de 12 casillas.
dropoff_distance_tiles = 12
dropoff_min_gatherers = 3
builders = 2
# Una granja por cada 2 aldeanos que deban recoger comida.
gatherers_per_farm = 2
# Una casilla libre alrededor de cada edificio para no cerrar pasillos.
build_gap_tiles = 1
build_search_radius_tiles = 24
# Primer ataque con 6 unidades; cada oleada, 4 más.
first_wave = 6
wave_growth = 4
# Enemigos a 14 casillas o menos de su base: defensa. Un aldeano con un enemigo a 3
# casillas o menos huye a la base, salvo que ya esté a 2 o menos de ella.
defend_radius_tiles = 14
flee_enemy_tiles = 3
safe_base_tiles = 2
# Unidades en cola que mantiene en el cuartel.
barracks_queue = 2
villager_queue = 1
# Solo para ataque_fuerza (no lo usa este perfil).
attack_ratio_percent = 130
retreat_ratio_percent = 60
min_attack_army = 6
engage_radius_tiles = 8
# Sin apagar fuegos ni incursiones (no usa esos módulos).
extinguishers_per_fire = 0
army_min_villagers = 0
raid_unit = ""
raid_group = 1
raid_safe_radius_tiles = 0
pillage_guard_tiles = 0
# abastecer: la tropa que no pelea vuelve a abastecerse con menos del 30 % de víveres
# o munición (y espera junto al almacén a llenarse).
resupply_percent = 30
# Guarda comida para media ración por cada unidad que come.
